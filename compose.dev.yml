# Base PostgreSQL de développement. Les identifiants ne valent que pour la machine du développeur.
services:
  base:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masterclass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - base-masterclass:/var/lib/postgresql/data

volumes:
  base-masterclass:
